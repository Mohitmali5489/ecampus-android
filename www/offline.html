<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Offline</title>

<style>

body{

margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:sans-serif;

background:white;

}

.card{

text-align:center;

padding:30px;

}

h1{

font-size:32px;

margin-bottom:10px;

}

p{

color:#666;

margin-bottom:25px;

}

button{

padding:15px 35px;

border:none;

background:#059669;

color:white;

border-radius:30px;

font-size:18px;

cursor:pointer;

}

button:active{

transform:scale(.96);

}

</style>

</head>

<body>

<div class="card">

<h1>📡 No Internet</h1>

<p>Please check your internet connection.</p>

<button onclick="retry()">Retry</button>

</div>

<script>

function retry(){

if(navigator.onLine){

window.location.replace("index.html");

}else{

alert("Still offline");

}

}

window.addEventListener("online",()=>{

window.location.replace("index.html");

});

</script>

</body>

</html>
