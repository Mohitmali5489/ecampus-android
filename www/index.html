<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ECampus - Loading</title>
    <style>
        body { 
            background-color: #121212; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; height: 100dvh; 
        }
        .spinner { 
            width: 40px; 
            height: 40px; 
            border: 4px solid rgba(255,255,255,0.1); 
            border-top-color: #00C853; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="spinner"></div>

    <script>
        function bootApp() {
            // 1. Instant check: Is the device's WiFi/Data toggled off entirely?
            if (!navigator.onLine) {
                window.location.replace("offline.html");
                return;
            }
            
            // 2. Deep check: Are we actually connected to the internet?
            // We append Date.now() to bypass cache and force a real network request.
            fetch("https://mohitasdeveloper.github.io/ECampus/?ping=" + Date.now(), { method: 'HEAD', mode: 'no-cors', cache: 'no-store' })
            .then(() => {
                // Connection successful! Slide them into the live app.
                window.location.replace("https://mohitasdeveloper.github.io/ECampus/");
            })
            .catch(() => {
                // Device shows connected, but no actual internet access (e.g. captive portal).
                window.location.replace("offline.html");
            });
        }
        
        // Execute immediately
        bootApp();
    </script>
</body>
</html>
