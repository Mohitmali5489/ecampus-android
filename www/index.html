<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .spinner { width: 45px; height: 45px; border: 4px solid #f3f4f6; border-top: 4px solid #059669; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>

    <script>
        const LIVE_URL = "https://mohitasdeveloper.github.io/ECampus/";

        // Instantly check network on app open
        if (navigator.onLine) {
            window.location.replace(LIVE_URL);
        } else {
            window.location.replace("offline.html");
        }
    </script>
</body>
</html>
