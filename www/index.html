<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ECampus - Loading...</title>
    
    <style>
        body { background-color: #ffffff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
        .spinner { width: 45px; height: 45px; border: 4px solid #f3f4f6; border-top: 4px solid #059669; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #374151; font-weight: 600; font-size: 16px; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <div class="loading-text">Loading ECampus...</div>

    <script>
        const LIVE_APP_URL = 'https://ecampus-android.mohitmali.in/';

        function checkNetworkAndRoute() {
            if (navigator.onLine) {
                window.location.replace(LIVE_APP_URL);
            } else {
                window.location.replace('offline.html');
            }
        }

        window.addEventListener('load', () => {
            setTimeout(checkNetworkAndRoute, 500);
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('Local Service Worker registered successfully'))
                    .catch((error) => console.error('Local Service Worker failed:', error));
            }
        });
    </script>
</body>
</html>
