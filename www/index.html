<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ECampus - Offline</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; height: 100dvh; background-color: #121212; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; user-select: none; -webkit-user-select: none;
        }
        
        .brand-text {
            font-size: 42px; font-weight: 800; line-height: 1; margin-bottom: 8px;
            background: linear-gradient(to right, #00C853, #00A2FF, #2962FF);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .error-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #f5f5f5; }
        .error-subtitle { font-size: 14px; color: #a0a0a0; max-width: 280px; line-height: 1.5; margin-bottom: 40px; }

        .retry-btn {
            background-color: #006e1c; color: white; border: none; padding: 16px 36px;
            font-size: 15px; font-weight: 700; border-radius: 30px; cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 110, 28, 0.4);
            display: flex; align-items: center; gap: 8px; transition: transform 0.2s, opacity 0.2s;
        }
        .retry-btn:active { transform: scale(0.95); }
        .retry-btn.loading { opacity: 0.7; pointer-events: none; }

        .spinner {
            width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 1s linear infinite; display: none;
        }
        .retry-btn.loading .spinner { display: inline-block; }
        .retry-btn.loading .btn-text { display: none; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Icon completely removed -->
    
    <div class="brand-text">ECampus</div>
    <div class="error-title">You're Offline</div>
    <div class="error-subtitle">We couldn't connect to the campus servers. Please check your internet connection.</div>

    <button class="retry-btn" id="retry-btn" onclick="retryConnection()">
        <span class="spinner"></span>
        <span class="btn-text">Try Again</span>
    </button>

    <script>
        function retryConnection() {
            const btn = document.getElementById('retry-btn');
            btn.classList.add('loading');
            
            setTimeout(() => {
                window.location.replace("https://mohitasdeveloper.github.io/ECampus/");
                setTimeout(() => {
                    btn.classList.remove('loading');
                }, 1500);
            }, 500);
        }
    </script>

</body>
</html>
