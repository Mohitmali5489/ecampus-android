name: ECampus Web-Only Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Packages
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: "ECampusSecurePassword2026"
      KEY_ALIAS: "ecampus_key"
      KEY_PASSWORD: "ECampusSecurePassword2026"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare placeholder web directory
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><title>ECampus</title></head><body>Loading ECampus...</body></html>' > www/index.html

      - name: Install Dependencies & Plugins
        run: |
          npm install
          npx cap add android

      - name: Download Logo & Generate Assets
        run: |
          npm install -g @capacitor/assets
          mkdir -p assets
          curl -L "https://i.ibb.co/SwZ0jG2F/EC.png" -o assets/icon.png
          curl -L "https://i.ibb.co/SwZ0jG2F/EC.png" -o assets/splash.png
          npx @capacitor/assets generate --android

      - name: Write Complete AndroidManifest.xml
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          cat << 'EOF' > $MANIFEST_PATH
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false"
                  android:networkSecurityConfig="@xml/network_security_config">

                  <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="default" />
                  <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="true" />

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="FCM_PLUGIN_ACTIVITY" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="ecampus-android.mohitmali.in" android:pathPrefix="/" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"></meta-data>
                  </provider>
              </application>
          </manifest>
          EOF

      - name: Inject WebView Configurations
        run: |
          JAVA_PATH="android/app/src/main/java/com/mohit/ecampus/MainActivity.java"
          cat << 'EOF' > $JAVA_PATH
          package com.mohit.ecampus;

          import android.app.DownloadManager;
          import android.content.ContentValues;
          import android.content.Context;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.URLUtil;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onStart() {
                  super.onStart();
                  WebView webView = getBridge().getWebView();
                  WebSettings settings = webView.getSettings();
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                  webView.setOverScrollMode(WebView.OVER_SCROLL_NEVER); 

                  // 🚀 Native Scoped Storage & Gallery MediaStore Saver
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void saveBase64File(String base64Data, String fileName) {
                          try {
                              String mimeType = "application/octet-stream";
                              if (base64Data.startsWith("data:")) {
                                  int colonIndex = base64Data.indexOf(':');
                                  int semicolonIndex = base64Data.indexOf(';');
                                  if (colonIndex != -1 && semicolonIndex != -1) {
                                      mimeType = base64Data.substring(colonIndex + 1, semicolonIndex);
                                  }
                              } else {
                                  if (fileName.endsWith(".jpg") || fileName.endsWith(".jpeg")) mimeType = "image/jpeg";
                                  else if (fileName.endsWith(".png")) mimeType = "image/png";
                                  else if (fileName.endsWith(".webp")) mimeType = "image/webp";
                                  else if (fileName.endsWith(".mp4")) mimeType = "video/mp4";
                              }

                              String cleanBase64 = base64Data.replaceFirst("^data:[^;]*;base64,?", "");
                              byte[] fileBytes = Base64.decode(cleanBase64, Base64.DEFAULT);

                              boolean isImage = fileName.endsWith(".jpg") || fileName.endsWith(".jpeg") || fileName.endsWith(".png") || fileName.endsWith(".webp") || mimeType.startsWith("image/");
                              boolean isVideo = fileName.endsWith(".mp4") || fileName.endsWith(".webm") || mimeType.startsWith("video/");

                              // Android 10+ (API 29 - 36) Scoped Storage MediaStore Writer
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  ContentValues values = new ContentValues();
                                  values.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                                  values.put(MediaStore.MediaColumns.MIME_TYPE, mimeType);
                                  values.put(MediaStore.MediaColumns.IS_PENDING, 1);

                                  Uri collection;
                                  if (isImage) {
                                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/ECampus");
                                      collection = MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                                  } else if (isVideo) {
                                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/ECampus");
                                      collection = MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                                  } else {
                                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/ECampus");
                                      collection = MediaStore.Downloads.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                                  }

                                  Uri itemUri = getContentResolver().insert(collection, values);
                                  if (itemUri != null) {
                                      OutputStream os = getContentResolver().openOutputStream(itemUri);
                                      if (os != null) {
                                          os.write(fileBytes);
                                          os.close();
                                      }
                                      values.clear();
                                      values.put(MediaStore.MediaColumns.IS_PENDING, 0);
                                      getContentResolver().update(itemUri, values, null, null);

                                      String destination = isImage || isVideo ? "Gallery" : "Downloads";
                                      runOnUiThread(() -> Toast.makeText(getApplicationContext(), "Saved to " + destination + "!", Toast.LENGTH_SHORT).show());
                                  }
                              } else {
                                  // Android 9 and older fallback
                                  File dir;
                                  if (isImage) {
                                      dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES);
                                  } else if (isVideo) {
                                      dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES);
                                  } else {
                                      dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                  }
                                  if (!dir.exists()) dir.mkdirs();
                                  File file = new File(dir, fileName);
                                  FileOutputStream os = new FileOutputStream(file);
                                  os.write(fileBytes);
                                  os.close();

                                  MediaScannerConnection.scanFile(getApplicationContext(), new String[]{file.getAbsolutePath()}, new String[]{mimeType}, null);
                                  String destination = isImage || isVideo ? "Gallery" : "Downloads";
                                  runOnUiThread(() -> Toast.makeText(getApplicationContext(), "Saved to " + destination + "!", Toast.LENGTH_SHORT).show());
                              }
                          } catch (Exception e) {
                              e.printStackTrace();
                              runOnUiThread(() -> Toast.makeText(getApplicationContext(), "Save failed: " + e.getMessage(), Toast.LENGTH_SHORT).show());
                          }
                      }
                  }, "AndroidDownloader");

                  // Intercept WebView Standard HTTP Downloads
                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {
                          try {
                              String fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);

                              if (url.startsWith("blob:") || url.startsWith("data:")) {
                                  String js = "javascript: var xhr = new XMLHttpRequest();" +
                                              "xhr.open('GET', '" + url + "', true);" +
                                              "xhr.responseType = 'blob';" +
                                              "xhr.onload = function() {" +
                                              "    if (this.status === 200) {" +
                                              "        var reader = new FileReader();" +
                                              "        reader.readAsDataURL(this.response);" +
                                              "        reader.onloadend = function() {" +
                                              "            AndroidDownloader.saveBase64File(reader.result, '" + fileName + "');" +
                                              "        }" +
                                              "    }" +
                                              "};" +
                                              "xhr.send();";
                                  webView.evaluateJavascript(js, null);
                              } else {
                                  DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                                  request.setMimeType(mimeType);
                                  String cookies = CookieManager.getInstance().getCookie(url);
                                  request.addRequestHeader("cookie", cookies);
                                  request.addRequestHeader("User-Agent", userAgent);
                                  request.setDescription("Downloading file...");
                                  request.setTitle(fileName);
                                  request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                                  request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                                  
                                  DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                                  if (dm != null) {
                                      dm.enqueue(request);
                                      Toast.makeText(getApplicationContext(), "Downloading...", Toast.LENGTH_SHORT).show();
                                  }
                              }
                          } catch (Exception e) {
                              Toast.makeText(getApplicationContext(), "Download Error", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });
              }
          }
          EOF

      - name: Create Network Security Config File
        run: |
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
              <domain-config cleartextTrafficPermitted="false">
                  <domain includeSubdomains="true">ecampus-android.mohitmali.in</domain>
              </domain-config>
          </network-security-config>
          EOF

      - name: Inject Firebase google-services.json Configuration
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Sync Capacitor Changes & Inject Google Services Plugin
        run: |
          npx cap sync android
          sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Decode Permanent Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Setup Gradle Sign Environment Variables
        run: |
          echo "RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "RELEASE_STORE_PASSWORD=${{ env.KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "RELEASE_KEY_ALIAS=${{ env.KEY_ALIAS }}" >> android/gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ env.KEY_PASSWORD }}" >> android/gradle.properties

      - name: Inject Signing Configuration & Automate Version Code
        run: |
          GRADLE_PATH="android/app/build.gradle"
          APP_VARS_PATH="android/variables.gradle"
          
          if [ -f "$APP_VARS_PATH" ]; then
            sed -i "s/targetSdkVersion = .*/targetSdkVersion = 36/g" $APP_VARS_PATH
            sed -i "s/compileSdkVersion = .*/compileSdkVersion = 36/g" $APP_VARS_PATH
          fi
          sed -i "s/targetSdkVersion .*/targetSdkVersion 36/g" $GRADLE_PATH
          sed -i "s/compileSdkVersion .*/compileSdkVersion 36/g" $GRADLE_PATH
          
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" $GRADLE_PATH
          sed -i "s/versionName \"1.0\"/versionName \"2.0.3\"/g" $GRADLE_PATH
          
          sed -i '/buildTypes {/i \    signingConfigs {\n        release {\n            storeFile file(RELEASE_STORE_FILE)\n            storePassword RELEASE_STORE_PASSWORD\n            keyAlias RELEASE_KEY_ALIAS\n            keyPassword RELEASE_KEY_PASSWORD\n        }\n    }' $GRADLE_PATH
          sed -i '/minifyEnabled/i \            signingConfig signingConfigs.release' $GRADLE_PATH

      - name: Make Gradle Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug & Signed Release Packages
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECampus-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECampus-Release-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Signed Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECampus-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
